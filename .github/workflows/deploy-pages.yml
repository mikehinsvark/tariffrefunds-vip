name: Deploy tariffrefunds.vip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            partner-app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install partner site dependencies
        working-directory: partner-app
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm exec vite build
        env:
          VITE_STATIC_EXPORT: "true"
      - name: Build partner landing page
        working-directory: partner-app
        run: pnpm exec vite build
        env:
          VITE_BASE_PATH: "/partner/"
      - name: Add partner site to deployment
        run: |
          rm -rf dist/public/partner
          mkdir -p dist/public/partner
          cp -a partner-app/dist/public/. dist/public/partner/
      - name: Disable Jekyll
        run: touch dist/public/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
